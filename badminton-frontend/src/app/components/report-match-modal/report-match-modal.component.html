<div class="modal" [class.show]="show" [style.display]="show ? 'block' : 'none'">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ 'dashboard.report_result_modal' | translate }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'form.match_type' | translate }}</label>
              <select class="form-select" formControlName="match_type">
                <option *ngFor="let type of matchTypes" [value]="type.value">
                  {{ type.labelKey | translate }}
                </option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'form.stake_value' | translate }}</label>
              <select class="form-select" formControlName="stake_value">
                <option *ngFor="let stake of stakeValues" [value]="stake.value">
                  <ng-container *ngIf="stake.labelKey">
                    {{ stake.value }} ({{ stake.labelKey | translate }})
                  </ng-container>
                  <ng-container *ngIf="!stake.labelKey">
                    {{ stake.label }}
                  </ng-container>
                  {{ 'stake.points' | translate }}
                </option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'match.team1' | translate }}</label>
              <div formArrayName="team1_player_ids">
                <div *ngFor="let control of team1Players.controls; let i = index" class="mb-2">
                  <select class="form-select" [formControlName]="i">
                    <option [value]="null">{{ 'form.select_player' | translate }} {{ i + 1 }}</option>
                    <option *ngFor="let user of allUsers" [value]="user.user_id">
                      {{ user.display_name }} ({{ user.level }})
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">{{ 'match.team2' | translate }}</label>
              <div formArrayName="team2_player_ids">
                <div *ngFor="let control of team2Players.controls; let i = index" class="mb-2">
                  <select class="form-select" [formControlName]="i">
                    <option [value]="null">{{ 'form.select_player' | translate }} {{ i + 1 }}</option>
                    <option *ngFor="let user of allUsers" [value]="user.user_id">
                      {{ user.display_name }} ({{ user.level }})
                    </option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">{{ 'form.winning_team' | translate }}</label>
            <select class="form-select" formControlName="winning_team">
              <option [value]="null">{{ 'form.select_winner' | translate }}</option>
              <option [value]="1">{{ 'match.team1' | translate }}</option>
              <option [value]="2">{{ 'match.team2' | translate }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">{{ 'form.notes_optional' | translate }}</label>
            <textarea class="form-control" formControlName="notes" rows="2" [placeholder]="'admin.enter_notes' | translate"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">{{ 'form.youtube_link' | translate }}</label>
            <input type="url" class="form-control" formControlName="match_video_url" placeholder="https://youtube.com/watch?v=...">
            <small class="text-muted">{{ 'form.youtube_hint' | translate }}</small>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">
              {{ 'btn.cancel' | translate }}
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="loading || reportForm.invalid">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ 'btn.submit' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" [class.show]="show" *ngIf="show" (click)="closeModal()"></div>
