<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <h2>🏸 Metfone Badminton Ranking</h2>
      <p class="text-muted">Đăng nhập vào hệ thống</p>
    </div>

    <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ error }}
      <button type="button" class="btn-close" (click)="error=''" aria-label="Close"></button>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Email</label>
        <input 
          type="email" 
          class="form-control" 
          id="username" 
          formControlName="username"
          [class.is-invalid]="submitted && f['username'].errors"
          placeholder="Nhập email">
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Vui lòng nhập email</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          formControlName="password"
          [class.is-invalid]="submitted && f['password'].errors"
          placeholder="Nhập mật khẩu">
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Vui lòng nhập mật khẩu</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Đăng nhập
      </button>

      <div class="text-center mb-3">
        <a href="javascript:void(0)" (click)="showForgotPassword = true" class="text-decoration-none">Quên mật khẩu?</a>
      </div>

      <div class="text-center">
        <p class="mb-0">Chưa có tài khoản? <a routerLink="/register" class="text-decoration-none">Đăng ký ngay</a></p>
      </div>
    </form>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal" [class.show]="showForgotPassword" [style.display]="showForgotPassword ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Quên Mật Khẩu</h5>
        <button type="button" class="btn-close" (click)="closeForgotPassword()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="forgotPasswordSuccess" class="alert alert-success">
          {{ forgotPasswordSuccess }}
        </div>
        <div *ngIf="forgotPasswordError" class="alert alert-danger">
          {{ forgotPasswordError }}
        </div>
        <p>Nhập email của bạn để gửi yêu cầu reset mật khẩu đến quản trị viên.</p>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
            [(ngModel)]="forgotPasswordEmail"
            placeholder="Nhập email của bạn">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeForgotPassword()">Đóng</button>
        <button type="button" class="btn btn-primary" (click)="submitForgotPassword()" [disabled]="!forgotPasswordEmail || forgotPasswordLoading">
          <span *ngIf="forgotPasswordLoading" class="spinner-border spinner-border-sm me-2"></span>
          Gửi yêu cầu
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop" [class.show]="showForgotPassword" *ngIf="showForgotPassword"></div>
